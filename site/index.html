<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Следопыт</title>
<style>
  :root {
    --paper: #FAFAF7;
    --ink: #16181C;
    --ink-soft: #545A63;
    --rule: #E4E3DC;
    --amber: #9A6708;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #101216;
      --ink: #ECEBE5;
      --ink-soft: #A6ACB5;
      --rule: #2B2F37;
      --amber: #EFB330;
    }
  }
  * { box-sizing: border-box; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 17px;
    line-height: 1.6;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
  }
  main { max-width: 32rem; }
  .eyebrow {
    font-size: 0.75rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--amber);
    margin: 0 0 0.8rem;
  }
  h1 {
    font-size: clamp(2rem, 6vw, 2.8rem);
    line-height: 1.15;
    margin: 0 0 1rem;
    letter-spacing: -0.02em;
  }
  p { color: var(--ink-soft); margin: 0 0 1rem; }
  p:last-child { margin-bottom: 0; }
  hr { border: 0; border-top: 1px solid var(--rule); margin: 2rem 0; }
  .meta { font-size: 0.85rem; color: var(--ink-soft); }
</style>
</head>
<body>
<main>
  <p class="eyebrow">В разработке</p>
  <h1>Следопыт</h1>
  <p>Сопровождение семьи в освоении видеоувеличителя. Проект некоммерческой
     организации «Чтобы Видеть!».</p>
  <p>Сейчас здесь заглушка — страница появится, когда будет готов генератор
     заданий.</p>
  <hr>
  <p class="meta">Учебный проект. Персональные данные не собираются.</p>
</main>
</body>
</html>
